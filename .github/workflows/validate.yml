name: Validate content
on: [push, pull_request]
# A new push supersedes the previous run on the same branch: stop the stale one
# instead of letting two full validations queue behind each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Pure content + Python/SQL checks: no compilers needed.
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: node scripts/validate.mjs
      - run: node scripts/test-game.mjs
      - run: node scripts/test-sync.mjs
      - run: node scripts/test-worker.mjs
      - run: node scripts/validate-katas.mjs
      - run: node scripts/gen-lite.mjs --check
  # Drills and snippets compile real C/C++/Zig, so they need the toolchain.
  drills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install Zig 0.17.0
        run: |
          curl -fsSL -o zig.tar.xz https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz
          echo "1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026  zig.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/zig" && tar -xJf zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"
      - run: node scripts/validate-drills.mjs --require
      - run: node scripts/validate-snippets.mjs --require
      - run: node scripts/gen-drills.mjs --check
  # Native catalog checks other than the big compile-everything matrix.
  native-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install Zig 0.17.0
        run: |
          curl -fsSL -o zig.tar.xz https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz
          echo "1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026  zig.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/zig" && tar -xJf zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"
      - run: node scripts/validate-native-katas.mjs --require
      - run: node scripts/test-local-runner.mjs
      - run: node scripts/validate-native-projects.mjs
      - run: node scripts/native/check-coverage.mjs
      - run: node scripts/native/test-zip.mjs
      - name: Verify native instruction/provenance and semantic matrix
        run: node scripts/native/semantic-audit.mjs
      - name: Reject native semantic regression fixtures
        run: node scripts/native/contract-regressions.mjs
  # The long pole (~7 of the ~10 minutes): compile + run every native solution and
  # starter. Sharded by language — the script already filters on the language name,
  # and per-shard --require-all keeps the same strictness as the unsharded run.
  native-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix: { language: [c, cpp, zig] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install Zig 0.17.0
        run: |
          curl -fsSL -o zig.tar.xz https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz
          echo "1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026  zig.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/zig" && tar -xJf zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"
      - run: node scripts/native/validate.mjs --require-all ${{ matrix.language }}
