name: Set up Zig
description: Installs a pinned, checksum-verified Zig and caches it between runs.
inputs:
  version: { required: true }
  sha256: { required: true }
runs:
  using: composite
  steps:
    - id: cache
      uses: actions/cache@v4
      with:
        path: ~/zig
        key: zig-${{ inputs.version }}-${{ runner.os }}
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        curl -fsSL -o zig.tar.xz https://ziglang.org/download/${{ inputs.version }}/zig-x86_64-linux-${{ inputs.version }}.tar.xz
        echo "${{ inputs.sha256 }}  zig.tar.xz" | sha256sum -c -
        mkdir -p "$HOME/zig" && tar -xJf zig.tar.xz -C "$HOME/zig" --strip-components=1
    - shell: bash
      run: echo "$HOME/zig" >> "$GITHUB_PATH"
